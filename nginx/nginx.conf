worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    
    # ===== SECURITY: Hide server version =====
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    
    # ===== SECURITY: Rate limiting zones =====
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    
    # ===== SECURITY: Body size limits =====
    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    
    # ===== SECURITY: Timeouts =====
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;
    
    # ===== SECURITY: IP filtering for malicious patterns =====
    # Block common attack patterns
    map $request_uri $is_bad_request {
        default 0;
        "~*\.env" 1;
        "~*\.git" 1;
        "~*\.svn" 1;
        "~*wp-admin" 1;
        "~*wp-login" 1;
        "~*xmlrpc\.php" 1;
        "~*\.sql$" 1;
        "~*\.sh$" 1;
        "~*\.bak$" 1;
        "~*\.zip$" 1;
        "~*\.tar\.gz$" 1;
        "~*\.war$" 1;
        "~*\.jar$" 1;
        "~*\.exe$" 1;
        "~*\.dll$" 1;
        "~*/\.htaccess" 1;
        "~*/config\.php" 1;
        "~*phpinfo" 1;
        "~*admin\.php" 1;
        "~*shell\.php" 1;
    }
    
    # ===== HTTP → HTTPS redirect =====
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    
    # ===== HTTPS server =====
    server {
        listen 443 ssl http2;
        server_name gfin-system.com www.gfin-system.com;
        
        # ===== SSL hardening =====
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key  /etc/nginx/certs/key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # ===== SECURITY HEADERS =====
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-DNS-Prefetch-Control "off" always;
        
        # ===== Connection limits =====
        limit_conn conn 20;
        
        # ===== Block malicious requests =====
        if ($is_bad_request) { return 403; }
        
        # ===== Block suspicious user agents =====
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wpscan|hydra|metasploit|burp|zap|nuclei)) {
            return 403;
        }
        
        # ===== API endpoints with rate limiting =====
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 10s;
            client_max_body_size 10M;
        }
        
        # ===== Auth endpoints with stricter rate limiting =====
        location /api/police/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===== File upload endpoint with larger limit =====
        location /api/complaints/ {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
            proxy_read_timeout 120s;
        }
        
        # ===== Health check =====
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
        
        # ===== All other routes → FastAPI (homepage, victim, scam-sites, etc.) =====
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        
        # ===== Deny access to sensitive paths =====
        location ~ /\.(env|git|svn|htaccess|htpasswd) {
            deny all;
            return 404;
        }
        
        location ~* \.(sql|bak|sh|py|conf|ini|log)$ {
            deny all;
            return 404;
        }
    }
}
