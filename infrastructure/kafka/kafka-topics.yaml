# GFIN Kafka Topic CRDs — Strimzi Infrastructure as Code
# Deploy with: kubectl apply -f kafka-topics.yaml -n gfin
#
# Status: REQUIRES EXTERNAL INFRASTRUCTURE
# Requires: Strimzi Kafka operator deployed in namespace 'gfin'

---
# Entity Events — 12 partitions, 7 day retention
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: gfin-events-entity
  namespace: gfin
  labels:
    strimzi.io/cluster: gfin-kafka
    app: gfin
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    min.insync.replicas: 2
    compression.type: lz4
    cleanup.policy: delete

---
