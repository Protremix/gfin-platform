---
# KafkaUser: gfin-entity-resolver
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: gfin-entity-resolver
  namespace: gfin
  labels:
    strimzi.io/cluster: gfin-kafka
    app: gfin
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - operation: Read
        topic: gfin-events-entity
        group: gfin-entity-resolver
      - operation: Write
        topic: gfin-dlq-entity

---
