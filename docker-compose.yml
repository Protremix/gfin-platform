# GFIN Minimum Viable Infrastructure — Docker Compose
# 
# Purpose: Pass all 12 infrastructure acceptance tests on a single cheap server.
# NOT for production. Single instance, no HA, no replicas.
#
# Cheapest Hetzner server that works:
#   CPX31 (4 vCPU, 8 GB, 80 GB) — ~€12-15/mo (tight, requires JVM tuning)
#   CPX41 (8 vCPU, 16 GB, 240 GB) — ~€20-25/mo (comfortable)
#   CCX13 (2 vCPU, 8 GB, 80 GB) — ~€43/mo (dedicated vCPU)
#
# Usage:
#   docker compose up -d
#   sleep 60  # wait for services to start
#   GFIN_RUN_INTEGRATION=1 python -m pytest tests/production/test_deployment_acceptance.py -v
#
# All services accessible on localhost.

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gfin
      POSTGRES_USER: gfin
      POSTGRES_PASSWORD: gfin_temp_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfin"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── MinIO (S3-compatible) ───
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gfin
      MINIO_ROOT_PASSWORD: gfin_temp_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Vault (dev mode — unsealed, auto-init) ───
  vault:
    image: hashicorp/vault:1.18
    command: server -dev -dev-root-token-id=gfin-root-token
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Neo4j ───
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/gfin_temp_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── OpenSearch ───
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      cluster.name: gfin-cluster
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Kafka (KRaft mode — no Zookeeper) ───
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka/data
    deploy:
      resources:
        limits:
          memory: 768M

  # ─── Kafka topic creation (one-shot) ───
  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 15
        for topic in \
          gfin-events-entity gfin-events-report gfin-events-evidence \
          gfin-events-alert gfin-events-discovery gfin-events-audit \
          gfin-events-federation \
          gfin-dlq-entity gfin-dlq-report gfin-dlq-evidence \
          gfin-dlq-alert gfin-dlq-discovery gfin-dlq-audit \
          gfin-dlq-federation; do
          kafka-topics.sh --create --if-not-exists \
            --bootstrap-server kafka:9092 \
            --topic "$$topic" \
            --partitions 1 --replication-factor 1
          echo "Created topic: $$topic"
        done
        echo "All 14 Kafka topics created."
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9090"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: gfin_temp_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Nginx with self-signed TLS (for TLS test) ───
  nginx-tls:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./web:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
  miniodata:
  neo4jdata:
  osdata:
  kafkadata:
  promdata:
