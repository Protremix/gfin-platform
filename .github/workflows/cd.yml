# GFIN CD Pipeline
# Deploys on push to main (Layer B — production infrastructure)
# This pipeline is production-ready but REQUIRES EXTERNAL INFRASTRUCTURE to execute.
# It will not run successfully until the target cloud environment is provisioned.

name: GFIN CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Build Docker Images ───
  # Only builds services that have an actual Dockerfile present.
  # Future services (identity, entity, evidence, ai-gateway, police-api) are
  # PENDING — their Dockerfiles and service implementations do not yet exist.
  # They will be added to the matrix as each service is implemented.
  build:
    name: Build Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Pending Services ───
  # The following services are planned but not yet implemented:
  #   - identity       → Module 02 (Security & Identity) service extraction
  #   - entity         → Module 04 (Entity Resolution) service extraction
  #   - evidence       → Module 06 (Evidence Vault) service extraction
  #   - ai-gateway     → Module 19/20 (Model Gateway / OpenAI) service extraction
  #   - police-api     → Module 23 (Police API) service extraction
  # Each will be added to the build matrix once its Dockerfile is created.

  # ─── Deploy to Kubernetes ───
  # REQUIRES EXTERNAL INFRASTRUCTURE — Kubernetes cluster must be provisioned
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        # REQUIRES EXTERNAL INFRASTRUCTURE: kubeconfig secret must be configured
        run: |
          echo "REQUIRES EXTERNAL INFRASTRUCTURE: Kubernetes cluster not provisioned"
          echo "This step will deploy to Kubernetes once infrastructure is ready."
          echo "kubectl apply -f infrastructure/kubernetes/ -n gfin"
          exit 1
