[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfin"
version = "0.1.0"
description = "Global Fraud Intelligence Network"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "GFIN Project"}]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
    "safety>=3.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

# ─── Ruff: Linting + Formatting ───
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # assert usage in tests
    "S104",  # binding to all interfaces (dev server)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"**/conftest.py" = ["S", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── MyPy: Type Checking ───
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["packages"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─── Pytest ───
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=packages --cov-report=term-missing --cov-fail-under=0"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
pythonpath = ["packages"]

[tool.coverage.run]
source = ["packages"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
precision = 2
